server.port=8081
spring.application.name=ticketguard

# Datasource
spring.datasource.url=jdbc:postgresql://aws-1-eu-west-1.pooler.supabase.com:6543/postgres?\
  user=postgres.jfdsvhfyfemzuaskaxhv&password=r!ngw0rm200\
  &autosave=always&prepareThreshold=0
spring.datasource.username=postgres.jfdsvhfyfemzuaskaxhv
spring.datasource.password=r!ngw0rm200
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.connection-init-sql=DEALLOCATE ALL
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.use_streams_for_binary=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Disable security password warning
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# JWT
jwt.secret=ThisIsAVeryLongSecretKeyThatIsAtLeast64CharactersLongForHS512AlgorithmSecurity
jwt.expiration=2592000000

# OTP
app.otp.expiry-minutes=5

logging.level.org.springframework.web=INFO
logging.level.com.ticketguard=DEBUG