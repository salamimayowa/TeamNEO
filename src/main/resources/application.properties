server.port=8081
spring.application.name=ticketguard

# Supabase Database
spring.datasource.url=jdbc:postgresql://[YOUR_SUPABASE_PROJECT_REF].supabase.co:5432/postgres?sslmode=require
spring.datasource.username=postgres
spring.datasource.password=[YOUR_SUPABASE_PASSWORD_HERE]
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=TicketGuard2026SuperSecretKeyForHackathonMakeItAtLeast64CharactersLong!!!
jwt.expiration=86400000

# OTP
app.otp.expiry-minutes=5

logging.level.org.springframework.web=INFO
logging.level.com.ticketguard=DEBUG